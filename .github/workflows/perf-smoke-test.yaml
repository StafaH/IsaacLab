name: Performance Smoke Test

on:
  pull_request:
    branches: [main, develop, 'release/**']
    types: [opened, labeled, synchronize, reopened, ready_for_review]
    paths:
      - ".github/actions/**"
      - ".github/workflows/config.yaml"
      - ".github/workflows/perf-smoke-test.yaml"
      - "docker/**"
      - "pyproject.toml"
      - "source/**"
      - "tools/perf_smoke_test/**"
  push:
    branches: [main, develop, 'release/**']
    paths:
      - ".github/actions/**"
      - ".github/workflows/config.yaml"
      - ".github/workflows/perf-smoke-test.yaml"
      - "docker/**"
      - "pyproject.toml"
      - "source/**"
      - "tools/perf_smoke_test/**"
  merge_group:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: perf-smoke-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    name: Configure benchmarks
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci:run-perf'))
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.config.outputs.base_sha }}
      image_tag: ${{ steps.config.outputs.image_tag }}
      isaacsim_image_name: ${{ steps.config.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.config.outputs.isaacsim_image_tag }}
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          f=.github/workflows/config.yaml
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_BASE_SHA" =~ ^0+$ ]]; then
            EVENT_BASE_SHA=$(git rev-parse HEAD^)
          fi
          {
            echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")"
            echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")"
            echo "image_tag=isaac-lab-perf:${GITHUB_SHA}"
            echo "matrix=$(jq -c '{include: [.cases[] | {key, timeout_minutes}]}' tools/perf_smoke_test/tasks.json)"
            echo "base_sha=$EVENT_BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        run: uv run --no-project python -c "from pathlib import Path; from tools.perf_smoke_test.compare import load_config; load_config(Path('tools/perf_smoke_test/tasks.json'))"

  build:
    name: Build benchmark image
    needs: config
    runs-on: ${{ fromJSON(vars.PERF_SMOKE_RUNS_ON || '["self-hosted","gpu"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Build or pull exact image
        uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ needs.config.outputs.image_tag }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base
          pull-on-deps-hit: true

  benchmark:
    name: Benchmark / ${{ matrix.key }}
    needs: [config, build]
    runs-on: ${{ fromJSON(vars.PERF_SMOKE_RUNS_ON || '["self-hosted","gpu"]') }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Pull exact image
        uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ needs.config.outputs.image_tag }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base
          pull-on-deps-hit: true

      - name: Run ASV benchmark
        env:
          IMAGE_TAG: ${{ needs.config.outputs.image_tag }}
          PERF_SMOKE_CASE: ${{ matrix.key }}
        run: |
          set -euo pipefail
          results="$GITHUB_WORKSPACE/tools/perf_smoke_test/results"
          mkdir -p "$results"
          chmod a+rwx "$results"
          if [[ ! -e "$GITHUB_WORKSPACE/_isaac_sim" && ! -L "$GITHUB_WORKSPACE/_isaac_sim" ]]; then
            ln -s /isaac-sim "$GITHUB_WORKSPACE/_isaac_sim"
          fi
          docker run --rm --gpus all --network host \
            -e PERF_SMOKE_CASE \
            -e GITHUB_SHA \
            -v "$GITHUB_WORKSPACE:/workspace/isaaclab:ro" \
            -v "$results:/workspace/isaaclab/tools/perf_smoke_test/results" \
            "$IMAGE_TAG" bash -lc '
              set -euo pipefail
              gpu_names=$(nvidia-smi --query-gpu=name --format=csv,noheader | sort -u)
              if [[ "$gpu_names" != "NVIDIA L40S" ]]; then
                echo "Expected an NVIDIA L40S runner, found: $gpu_names" >&2
                exit 1
              fi
              cd /workspace/isaaclab/tools/perf_smoke_test
              ../../isaaclab.sh -p -m pip install --quiet --target /tmp/asv asv==0.6.6
              export PYTHONPATH="/tmp/asv${PYTHONPATH:+:$PYTHONPATH}"
              ../../isaaclab.sh -p -m asv machine --config asv.conf.json --yes --machine "perf-${PERF_SMOKE_CASE}-l40s"
              ../../isaaclab.sh -p -m asv run --config asv.conf.json -E existing:same \
                --machine "perf-${PERF_SMOKE_CASE}-l40s" --launch-method spawn \
                --set-commit-hash "$GITHUB_SHA" --no-pull
            '

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-asv-${{ matrix.key }}
          path: tools/perf_smoke_test/results/
          if-no-files-found: error

  compare:
    name: Compare with baseline
    if: always() && needs.config.result == 'success'
    needs: [config, benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore baseline history
        run: |
          set -euo pipefail
          results=tools/perf_smoke_test/results
          mkdir -p "$results"
          if git fetch origin perf-baselines && git cat-file -e FETCH_HEAD:asv; then
            temp_dir=$(mktemp -d)
            git archive FETCH_HEAD asv | tar -x -C "$temp_dir"
            cp -a "$temp_dir/asv/." "$results/"
          fi

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: perf-asv-*
          path: tools/perf_smoke_test/results
          merge-multiple: true

      - name: Compare results
        env:
          BASE_SHA: ${{ needs.config.outputs.base_sha }}
        run: |
          set +e
          uv run --no-project python tools/perf_smoke_test/compare.py \
            --results-dir tools/perf_smoke_test/results \
            --tasks tools/perf_smoke_test/tasks.json \
            --current-sha "$GITHUB_SHA" \
            --base-sha "$BASE_SHA" \
            --summary-file perf-summary.md
          status=$?
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  publish:
    name: Publish baseline
    if: github.event_name == 'push'
    needs: [config, benchmark, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: perf-asv-*
          path: new-results
          merge-multiple: true

      - name: Commit ASV results
        run: |
          set -euo pipefail
          worktree=$(mktemp -d)
          trap 'git worktree remove --force "$worktree"' EXIT
          if git fetch origin perf-baselines; then
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            git worktree add --detach "$worktree" HEAD
            git -C "$worktree" switch --orphan perf-baselines
            git -C "$worktree" rm -rf .
          fi
          mkdir -p "$worktree/asv"
          cp -a new-results/. "$worktree/asv/"
          git -C "$worktree" add asv
          git -C "$worktree" config user.name github-actions
          git -C "$worktree" config user.email github-actions@github.com
          git -C "$worktree" commit -m "Update performance baselines for ${GITHUB_SHA}" || exit 0
          git -C "$worktree" push origin HEAD:perf-baselines
