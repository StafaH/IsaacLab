name: Performance Smoke - Unit Tests

on:
  pull_request:
    paths:
      - ".github/workflows/perf-smoke-*.yaml"
      - "tools/perf_smoke_test/**"
  push:
    branches: [main, develop, 'release/**']
    paths:
      - ".github/workflows/perf-smoke-*.yaml"
      - "tools/perf_smoke_test/**"
  workflow_dispatch:

concurrency:
  group: perf-smoke-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Validate ASV benchmarks
        working-directory: tools/perf_smoke_test
        run: uv run --no-project --with asv==0.6.6 asv check -E existing:same --config asv.conf.json

      - name: Test comparison policy
        run: uv run --no-project --with pytest pytest -q tools/perf_smoke_test
